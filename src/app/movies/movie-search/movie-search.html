<form role="search" class="flex gap-2 md:ml-auto md:max-w-md" (submit)="onSubmit($event)">
  <label for="movie-search-input" class="sr-only">Search movies</label>
  <div class="relative flex-1">
    <input
      #searchInput
      id="movie-search-input"
      type="text"
      autocomplete="off"
      placeholder="Search movies"
      [value]="draft()"
      (input)="onInput($event)"
      class="w-full rounded-md border border-slate-300 px-3 py-2 pr-9 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600"
    />
    @if (draft() !== '') {
      <button
        type="button"
        aria-label="Clear search"
        (click)="clear(searchInput)"
        class="absolute inset-y-0 right-0 px-3 text-slate-500 hover:text-slate-900 focus-visible:outline-2 focus-visible:outline-sky-600"
      >
        ×
      </button>
    }
  </div>
  <button
    type="submit"
    class="rounded-md bg-sky-700 px-4 py-2 font-medium text-white hover:bg-sky-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600"
  >
    Search
  </button>
</form>
